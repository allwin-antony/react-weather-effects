name: Publish to npm & GitHub Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (validate build and pack without publishing to npm or creating release)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write # Required for creating Git tags & GitHub Releases
  id-token: write # Required for npm Trusted Publishing (OIDC) & provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for changelog / release notes generation

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Upgrade npm CLI (Required for OIDC Trusted Publishing)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build packages
        run: pnpm build

      - name: Publish to npm (Dry Run)
        if: ${{ inputs.dry_run }}
        run: |
          cd packages/react-weather-effects
          npm publish --dry-run --access public

      - name: Publish to npm (Trusted Publishing / OIDC)
        if: ${{ !inputs.dry_run }}
        run: |
          cd packages/react-weather-effects
          npm publish --access public --provenance

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run && github.ref == 'refs/heads/main' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./packages/react-weather-effects/package.json').version")
          TAG="v$VERSION"
          echo "Checking if release $TAG already exists..."
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping release creation."
          else
            echo "Creating GitHub Release $TAG..."
            gh release create "$TAG" \
              --title "v$VERSION" \
              --generate-notes
          fi
