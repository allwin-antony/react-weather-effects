name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (validate build and pack without publishing to npm)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for npm Trusted Publishing (OIDC) & provenance
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Upgrade npm CLI (Required for OIDC Trusted Publishing)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build packages
        run: pnpm build

      - name: Publish to npm (Dry Run)
        if: ${{ inputs.dry_run }}
        run: |
          cd packages/react-weather-effects
          npm publish --dry-run --access public

      - name: Publish to npm (Trusted Publishing / OIDC)
        if: ${{ !inputs.dry_run }}
        run: |
          cd packages/react-weather-effects
          npm publish --access public --provenance
