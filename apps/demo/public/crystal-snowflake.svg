<svg xmlns="http://www.w3.org/2000/svg" viewBox="-120 -120 240 240" width="256" height="256">
  <defs>
    <linearGradient id="iceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.9" />
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="1" />
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Central delicate hexagonal facet -->
  <polygon points="0,-18 15.59,-9 15.59,9 0,18 -15.59,9 -15.59,-9" fill="url(#centerGlow)" />
  <polygon points="0,-12 10.39,-6 10.39,6 0,12 -10.39,6 -10.39,-6" fill="#f0f9ff" opacity="0.9" />

  <!-- 6 symmetrical branches rotated at 60 degree intervals -->
  <g id="branches" stroke="url(#iceGrad)" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)">
    <!-- Branch 1: 0 deg (Up) -->
    <g id="singleBranch">
      <!-- Main spine -->
      <line x1="0" y1="-12" x2="0" y2="-100" stroke-width="4.5" />
      
      <!-- Diamond tip -->
      <polygon points="0,-108 -6,-98 0,-88 6,-98" fill="url(#iceGrad)" stroke-width="1" />
      
      <!-- Inner chevron branches -->
      <line x1="0" y1="-32" x2="-22" y2="-48" stroke-width="3.5" />
      <line x1="0" y1="-32" x2="22" y2="-48" stroke-width="3.5" />
      <!-- Side sub-twigs on inner chevron -->
      <line x1="-14" y1="-42" x2="-22" y2="-38" stroke-width="2" />
      <line x1="14" y1="-42" x2="22" y2="-38" stroke-width="2" />

      <!-- Middle chevron branches (larger with double feathering) -->
      <line x1="0" y1="-58" x2="-34" y2="-80" stroke-width="3.5" />
      <line x1="0" y1="-58" x2="34" y2="-80" stroke-width="3.5" />
      <!-- Sub-twigs -->
      <line x1="-18" y1="-69" x2="-32" y2="-66" stroke-width="2.2" />
      <line x1="18" y1="-69" x2="32" y2="-66" stroke-width="2.2" />
      <line x1="-24" y1="-73" x2="-26" y2="-86" stroke-width="2" />
      <line x1="24" y1="-73" x2="26" y2="-86" stroke-width="2" />

      <!-- Outer small chevron -->
      <line x1="0" y1="-80" x2="-18" y2="-94" stroke-width="2.8" />
      <line x1="0" y1="-80" x2="18" y2="-94" stroke-width="2.8" />

      <!-- Secondary delicate side ornaments -->
      <circle cx="-16" cy="-28" r="2.5" fill="#bae6fd" stroke="none" />
      <circle cx="16" cy="-28" r="2.5" fill="#bae6fd" stroke="none" />
    </g>

    <!-- Branch 2: 60 deg -->
    <use href="#singleBranch" transform="rotate(60)" />
    <!-- Branch 3: 120 deg -->
    <use href="#singleBranch" transform="rotate(120)" />
    <!-- Branch 4: 180 deg -->
    <use href="#singleBranch" transform="rotate(180)" />
    <!-- Branch 5: 240 deg -->
    <use href="#singleBranch" transform="rotate(240)" />
    <!-- Branch 6: 300 deg -->
    <use href="#singleBranch" transform="rotate(300)" />
  </g>

  <!-- Central crystalline starlet -->
  <circle cx="0" cy="0" r="4" fill="#ffffff" />
</svg>
